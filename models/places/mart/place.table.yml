schema: places
name: place
title: 日本の施設
description: |-
  日本の施設の位置です。1 行が 1 施設で、ブランド・店舗名・施設の種類・住所・営業時間を持ちます。

  - 約 7 割は自動販売機・ATM・郵便ポストなどの無人の設備です。店舗として数えるときは `is_unattended` が false の行に絞ってください
  - 個人店はほとんど収録されていません
  - 同じ店舗が複数のスパイダーから別の行で入ることがあります（コンビニとその中の銀行 ATM など）
keywords:
- POI
- 施設
- 店舗
- チェーン店
- ブランド
- GIS
sources:
- path: https://www.alltheplaces.xyz/
fields:
- name: place_id
  title: 施設 ID
  description: spider と AllThePlaces の ID を / でつないだもの。このテーブルで一意
- name: spider
  title: スパイダー名
  description: 施設を集めたスパイダー。日本向けは _jp で終わる（seven_eleven_jp など）
- name: brand
  title: ブランド
  description: brand:ja、無ければ brand。チェーンに属さない施設は NULL
- name: brand_en
  title: ブランド（英語）
- name: brand_wikidata
  title: ブランドの Wikidata ID
  description: 表記の違うブランド名をまとめるときのキー（セブン-イレブンは Q259340）
- name: name
  title: 名称
  description: name:ja、無ければ name。ブランド名だけのことが多く、店舗名は branch にある
- name: branch
  title: 店舗名
  description: 支店名・店舗名（「南７条」「日野駅前店」など）
- name: ref
  title: 店舗番号
  description: 各社が振る店舗コード
- name: category_key
  title: 種類のキー
  description: OpenStreetMap のキー（shop / amenity / leisure など）
- name: category
  title: 種類
  description: category_key の値（convenience・chemist・fast_food など）
- name: is_unattended
  title: 無人の設備
  description: 自動販売機・ATM・郵便ポスト・AED などの無人の設備なら true
- name: address
  title: 住所
  description: addr:full、無ければ都道府県・市区町村・番地。表記はスパイダーごとに違う
- name: postcode
  title: 郵便番号
- name: province
  title: 都道府県
  description: addr:province か addr:state。入っていないスパイダーが多い
- name: city
  title: 市区町村
  description: 入っていないスパイダーが多い
- name: phone
  title: 電話番号
- name: website
  title: Web サイト
  description: 各社の店舗ページ
- name: opening_hours
  title: 営業時間
  description: OpenStreetMap の opening_hours の書式（Mo-Fr 09:00-21:00 など）
- name: operator
  title: 運営者
- name: lat
  title: 緯度
- name: lon
  title: 経度
- name: geometry
  title: 位置
  description: 施設の位置を表す POINT
- name: run_id
  title: 実行 ID
  description: 取り込んだ AllThePlaces の実行。実行の開始日時（UTC）
- name: run_date
  title: 実行日
  description: 実行の開始日。各社のサイトを読んだのはこの日から数日のうち
